name: Continuous Integration

on: [push]

jobs:
    build:
        name: Run continuous integration jobs
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up pnpm
              uses: pnpm/setup@v1
              with:
                  runtime: node@24
                  cache: true

            - name: Lint codebase
              run: pnpm lint
